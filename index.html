<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Wiadomość</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#14181f; --accent:#1f6feb; --ok:#1a7f37; --err:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10141b; --card:#1b212c; --text:#eef1f6; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px;
    padding-top:calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size:1.2rem; margin:4px 0 14px; }
  .to { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .to button { padding:16px 8px; font-size:1.2rem; font-weight:600; border-radius:14px;
    border:3px solid transparent; background:var(--card); color:var(--text); }
  .to button.on { border-color:var(--accent); background:var(--accent); color:#fff; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:8px;
    background:#8b949e; border:2px solid #ffffff99; vertical-align:middle; }
  .dot.up { background:#2ea043; } .dot.down { background:#f85149; }
  .presets { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .presets button { min-height:84px; padding:10px; font-size:1.15rem; font-weight:600;
    border-radius:14px; border:none; background:var(--card); color:var(--text);
    box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .presets button:active { transform:scale(.97); }
  textarea { width:100%; min-height:110px; padding:14px; font-size:1.15rem; border-radius:14px;
    border:2px solid #8b949e55; background:var(--card); color:var(--text); font-family:inherit; resize:vertical; }
  #send { width:100%; margin-top:10px; padding:18px; font-size:1.3rem; font-weight:700;
    border:none; border-radius:14px; background:var(--accent); color:#fff; }
  #send:disabled { opacity:.5; }
  #status { margin-top:14px; min-height:1.6em; text-align:center; font-size:1.1rem; font-weight:600; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  #setup { display:none; padding:16px; border-radius:14px; background:var(--card); line-height:1.5; }
</style>
</head>
<body>
<main>
  <div id="setup">
    Aplikacja nie jest jeszcze skonfigurowana. Otwórz specjalny link konfiguracyjny (z dopiskiem <b>#...</b> na końcu), który dostałeś od Igora.
  </div>

  <div id="app">
    <h1>Do kogo?</h1>
    <div class="to" id="to"></div>

    <div class="presets" id="presets"></div>

    <textarea id="text" placeholder="Wpisz wiadomość…"></textarea>
    <button id="send">Wyślij</button>
    <div id="status" role="status"></div>
  </div>
</main>

<script>
// ---- EDIT THESE ----
// Who can receive messages. "id" must match MY_TAG in that computer's family_speaker.py.
const RECIPIENTS = [
  { id: "pc1", label: "Igor" },
  { id: "pc2", label: "Oskar" }
];
// One-tap buttons
const PRESETS = [
  "Obiad gotowy",
  "Chodź tutaj",
  "Telefon do ciebie",
  "Zejdź na dół",
  "Chodź jeść",
  "Odezwij się do nas"
];
// --------------------

const NTFY = "https://ntfy.sh/";

// Setup link looks like:  .../family/#t=SECRETTOPIC&who=Mom   (or who=Dad)
// It is read once, saved on this phone, then removed from the address bar,
// so the secret topic never lives in the public code.
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

if (location.hash.length > 1) {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("t")) store("topic", p.get("t"));
  if (p.get("who")) store("who", p.get("who"));
  history.replaceState(null, "", location.pathname + location.search);
}
const topic = load("topic");
const who = load("who");   // "Mom" or "Dad"; this is what the laptop speaks
let to = load("to");
if (!RECIPIENTS.some(r => r.id === to)) to = RECIPIENTS[0].id;

const $ = (id) => document.getElementById(id);
const statusEl = $("status");

if (!topic || !who) { $("setup").style.display = "block"; $("app").style.display = "none"; }

function setTo(id) {
  to = id;
  store("to", id);
  document.querySelectorAll(".to button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
}
RECIPIENTS.forEach(r => {
  const b = document.createElement("button");
  b.dataset.id = r.id;
  b.innerHTML = '<span class="dot" id="dot-' + r.id + '"></span>';
  b.appendChild(document.createTextNode(r.label));
  b.addEventListener("click", () => setTo(r.id));
  $("to").appendChild(b);
});
setTo(to);

// ---- online indicator: reads the heartbeats the laptops send to <topic>-status ----
const online = {};
async function checkOnline() {
  await Promise.all(RECIPIENTS.map(async (r) => {
    try {
      const res = await fetch(NTFY + encodeURIComponent(topic + "-status") +
        "/json?poll=1&since=150s&tags=" + encodeURIComponent(r.id));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      online[r.id] = txt.split("\n").some(l => { try { return JSON.parse(l).event === "message"; } catch (e) { return false; } });
    } catch (e) { online[r.id] = undefined; }
    const dot = document.getElementById("dot-" + r.id);
    if (dot) dot.className = "dot" + (online[r.id] === true ? " up" : online[r.id] === false ? " down" : "");
  }));
}
if (topic && who) {
  checkOnline();
  setInterval(checkOnline, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkOnline(); });
}

function show(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || "";
  if (cls === "ok") setTimeout(() => { statusEl.textContent = ""; statusEl.className = ""; }, 3500);
}

async function sendMessage(text) {
  text = text.trim();
  if (!text) { show("Wpisz najpierw wiadomość", "err"); return false; }
  $("send").disabled = true;
  show("Wysyłanie…");
  try {
    const r = await fetch(NTFY + encodeURIComponent(topic), {
      method: "POST",
      headers: { "Title": who, "Tags": to },
      body: text
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const label = RECIPIENTS.find(x => x.id === to).label;
    if (online[to] === false) show("Wysłano do: " + label + ", ale komputer wygląda na wyłączony", "err");
    else show("Wysłano do: " + label + " ✓", "ok");
    if (navigator.vibrate) navigator.vibrate(80);
    return true;
  } catch (e) {
    show("Nie udało się wysłać. Sprawdź internet.", "err");
    return false;
  } finally {
    $("send").disabled = false;
  }
}

PRESETS.forEach(p => {
  const b = document.createElement("button");
  b.textContent = p;
  b.addEventListener("click", () => sendMessage(p));
  $("presets").appendChild(b);
});

$("send").addEventListener("click", async () => {
  if (await sendMessage($("text").value)) $("text").value = "";
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
